<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content" class="animate-fade-in">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="flex items-start justify-between mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-900" th:text="${result.fullQuestion()}">Question</h3>
            </div>
            <span class="text-xs text-gray-400 flex-shrink-0 ml-3"
                  th:text="${#temporals.format(result.createdAt(), 'MMM d, HH:mm')}">Nov 27, 14:30</span>
        </div>

        <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-gray-700 whitespace-pre-wrap" th:text="${result.answer()}">Answer text...</p>
        </div>
    </div>
</div>

<div th:fragment="error" class="animate-fade-in">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="flex items-center space-x-3 mb-4">
            <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </div>
            <h3 class="font-semibold text-gray-900">Something went wrong</h3>
        </div>
        <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <p class="text-red-800 text-sm" th:text="${error}">Error message</p>
        </div>
    </div>
</div>

</html>
