spring.application.name=recursive-advisor-demo
spring.main.web-application-type=none

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

#It's a specialized evaluator model, not a general chat model. Flow-Judge is a small open-weight model specifically
# fine-tuned for the "LLM-as-a-Judge" task — scoring/grading another model's output — rather than a general-purpose
# assistant like Claude. T
# For more information see README.md
spring.ai.ollama.chat.model=avcodes/flowaicom-flow-judge:q4

# temperature=0 on the judge. Deterministic scoring — you want the judge to rate the same answer the same way every time,
# not introduce randomness into what's supposed to be an objective 1–4 rating.
spring.ai.ollama.chat.temperature=0

# disables Spring AI's auto-configured ChatClient.Builder bean (ChatClientAutoConfiguration) — the one Spring Boot
# would otherwise create for you automatically so you can just @Autowired ChatClient.Builder without building it yourself.

# This project has two ChatModel beans on the classpath — AnthropicChatModel and OllamaChatModel —
# and neither is marked @Primary. Without disabling the autoconfiguration, Spring Boot would try to satisfy
# that ChatModel chatModel parameter at startup, find two candidates, and fail with NoUniqueBeanDefinitionException
# — crashing the whole app before it even runs.
spring.ai.chat.client.enabled=false

