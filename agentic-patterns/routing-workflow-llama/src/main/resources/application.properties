spring.application.name=routing-workflow-llama

# Local Ollama server - no API key needed. Both models below are pulled/verified
# automatically at startup (see spring.ai.ollama.init.* below) - no manual
# "ollama pull" needed, just make sure the Ollama server itself is running.
#   llama3.2:1b - small/fast, used for classification and simple routes
#   llama3.1:8b - bigger, used for routes that need more reasoning
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.init.pull-model-strategy=always
spring.ai.ollama.init.timeout=60s
spring.ai.ollama.init.max-retries=2
spring.ai.ollama.init.chat.additional-models=llama3.1:8b

