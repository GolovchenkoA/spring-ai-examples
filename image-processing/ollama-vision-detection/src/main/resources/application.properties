spring.application.name=ollama-vision-detection
spring.main.web-application-type=none

# Better than llava for structured/spatial tasks like bounding boxes.
# Swap to try a different local vision model - no code changes needed:
#   ollama pull llava              then: spring.ai.ollama.chat.model=llava
#   ollama pull llama3.2-vision:11b then: spring.ai.ollama.chat.model=llama3.2-vision:11b
#   ollama pull moondream2         then: spring.ai.ollama.chat.model=moondream2
spring.ai.ollama.chat.model=qwen2.5vl:7b
spring.ai.ollama.chat.temperature=0.1

